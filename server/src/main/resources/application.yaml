server:
  address: 127.0.0.1
  port: 8081
spring:
  application:
    name: shopassist
  servlet:
    multipart:
      max-file-size: 256KB
      max-request-size: 300KB
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/ecommerce_rag?connectTimeout=3&socketTimeout=3}
    username: ${DB_USER:demo}
    password: ${DB_PASSWORD:local_demo_only}
    hikari:
      maximum-pool-size: 3
      connection-timeout: 3000
      initialization-fail-timeout: -1
  jdbc:
    template:
      query-timeout: 3
demo:
  embedding:
    provider: ${EMBEDDING_PROVIDER:ollama}
    base-url: ${BIGMODEL_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${BIGMODEL_API_KEY:}
    ollama-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    ollama-model: ${OLLAMA_EMBEDDING_MODEL:bge-m3:567m}
  chat:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
